[project]
name = "jaxdft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mads-Peter Verner Christiansen", email = "mpvc@bio.aau.dk" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12.0.1",
]

[project.scripts]
jaxdft = "jaxdft:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
docs = [
    "altair>=6.3.0",
    "jupyter>=1.1.1",
]
