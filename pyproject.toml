[project]
name = "jaxdft"
version = "0.1.0"
description = "A GPU-first plane-wave density functional theory code written in JAX."
readme = "README.md"
authors = [
    { name = "Mads-Peter Verner Christiansen", email = "mpvc@bio.aau.dk" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.12.0.1",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
]
docs = [
    "altair>=6.3.0",
    "jupyter>=1.1.1",
    "pandas>=3.1.1",
]

[tool.uv]
# The definition of done renders the docs, so the docs group is always needed.
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--import-mode=importlib"]
markers = [
    "slow: tests that take more than a few seconds on a laptop CPU",
]
filterwarnings = ["error"]
pythonpath = ["tests"]
