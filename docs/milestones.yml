# The single source of truth for project milestones.
#
# Read by the front page (docs/_tools/front_page.py, a Quarto post-render
# script) and by the milestone markers on engineering/project_stats.qmd.
# Adding a milestone means adding one entry here. A milestone with a
# validation document also needs one `featured.publish(...)` call in that
# document, which supplies the figure and headline numbers shown on the
# front page.
#
# Fields:
#   id          short label, also the name of the published figure
#   title       heading on the front page
#   capability  one line: what the code can do once this is reached
#   status      done | in-progress
#   reached     ISO timestamp, required when status is done
#   theory      path to the theory post, relative to docs/ (optional)
#   validation  path to the validation document, relative to docs/ (optional)

