project:
  type: website
  render:
    - "*.qmd"
    - "!_*.qmd"

execute:
  # Documents compute their results from jaxdft at render time. Never freeze:
  # a document that no longer runs against the current code is a failing test.
  freeze: false
  error: false

website:
  title: "jaxdft"
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: theory/index.qmd
        text: Theory
      - href: concepts/index.qmd
        text: Concepts
      - href: validation/index.qmd
        text: Validation
      - href: engineering/index.qmd
        text: Engineering
      - href: research/index.qmd
        text: Research
      - about.qmd

format:
  html:
    theme:
      - cosmo
      - brand
    css: styles.css
    toc: true
    html-math-method: mathjax
